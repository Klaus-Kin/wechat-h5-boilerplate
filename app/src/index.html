<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>💕~我们订婚啦~💍</title>
  <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
  <!-- 确保OG标签已部署 -->
  <meta content="💕~我们订婚啦~💍" property="og:title"/>
  <!-- 需HTTPS -->
  <meta content="https://wedding.jinsc.icu" property="og:url"/>
  <meta content="https://wedding.jinsc.icu/images/icon-0.jpg" property="og:image"/>
  <meta content="来不及上学给你写情书,那就现在写电子订婚函吧~" property="og:description"/>
  <meta content="电子订婚函" property="og:site_name"/>
  <meta content="website" property="og:type"/>

  <!-- 在此处添加您的 SEO 关键字和描述。 -->
  <meta content="我们订婚啦" name="keywords">
  <meta content="我们订婚啦" name="description">

  <link href="images/favicon.png" rel="shortcut icon" type="image/png"/>
  <!-- 在 <head> 标签内添加 优雅的手写草书字体 -->
  <!-- 合并字体请求 (Dancing Script + Great Vibes + Montserrat) -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500&display=swap"
        rel="stylesheet">

  <!-- 如果您需要 Apple Touch 图标，请取消注释。 -->
  <!--
  <link rel="apple-touch-icon" href="touch-icon-iphone.png">
  <link rel="apple-touch-icon" sizes="76x76" href="touch-icon-ipad.png">
  <link rel="apple-touch-icon" sizes="120x120" href="touch-icon-iphone-retina.png">
  <link rel="apple-touch-icon" sizes="152x152" href="touch-icon-ipad-retina.png">
  -->

  <!-- 不要删除它。它是开发工作流程所必需的。 -->
  <!-- inject:css -->
  <!-- endinject -->
</head>

<body>
<div class="loading-overlay">
  <div class="spinner">
    <div class="dot1"></div>
    <div class="dot2"></div>
  </div>
  <div class="load-text">Loading...</div>
</div>

<div class="swiper-container">
  <div class="swiper-wrapper">
    <!-- 第一页 -->
    <div class="swiper-slide slide-1">
      <!-- data-ani-name（动画名称）,data-ani-duration（动画执行时间），data-ani-delay（动画延迟时间）-->
      <!-- 设置2.1s延迟时间是因为在main.js中的read方法中,手动添加了2s的延迟时间，保证动画执行时间不冲突。 -->
      <p class="item-text-1-1 animated" data-ani-delay="2.1s" data-ani-duration="1s" data-ani-name="rotateIn">
        Save</p>
      <p class="item-text-1-2 animated" data-ani-delay="3.1s" data-ani-duration="1s" data-ani-name="rotateInDownLeft">
        The
        Date</p>
      <p class="item-text-1-3-1 animated" data-ani-delay="2s" data-ani-duration="5s" data-ani-name="zoomInLeft">
        金圣聪</p>
      <p class="item-text-1-3-2 animated" data-ani-delay="3s" data-ani-duration="3s" data-ani-name="fadeInUpBig"> & </p>
      <p class="item-text-1-3-3 animated" data-ani-delay="2s" data-ani-duration="5s" data-ani-name="zoomInRight">
        吴淑霞</p>
      <p class="item-text-1-4 animated" data-ani-delay="6s" data-ani-duration="1s" data-ani-name="jackInTheBox">
        2025 年 10 月 18 日</p>
    </div>

    <!-- 第二页 -->
    <div class="swiper-slide slide-2">
      <div class="slide-2-inbox animated" data-ani-delay="0s" data-ani-duration="1s" data-ani-name="rotateInDownRight">
      </div>
      <div class="slide-2-inbox animated" data-ani-delay="0s" data-ani-duration="1s" data-ani-name="rotateInDownLeft">
        <div class="item-image-2-1 animated" data-ani-delay="1s" data-ani-duration="6s" data-ani-name="fadeIn"></div>
        <div class="item-text-2-1">
          <span class="item-text-title animated" data-ani-delay="2s" data-ani-duration="3s" data-ani-name="fadeIn">
            这是一封订婚邀请函<br>
          </span>
          <span class="animated" data-ani-delay="2s" data-ani-duration="5s" data-ani-name="fadeIn">
            生命中最重要的仪式即将开启<br>
            各位亲朋好友们<br>
            我们需要您来到现场为我们见证<br>
            幸福时刻<br>
            开启我们的甜蜜新篇章
          </span>
        </div>
        <div class="item-text-2-2 animated" data-ani-delay="3s" data-ani-duration="2s" data-ani-name="zoomInLeft">
          时间⏰️：2025年10月18日
        </div>
        <div class="item-text-2-3 animated" data-ani-delay="4s" data-ani-duration="2s" data-ani-name="zoomInRight">
          地点📍：仙居臻品安福酒店
        </div>
      </div>
    </div>

    <!-- 第三页 -->
    <div class="swiper-slide slide-3">
      <div class="slide-bg animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="fadeInUp"></div>
      <div class="slide-newbie-avatar animated" data-ani-delay="1.5s" data-ani-duration="2s"
           data-ani-name="bounceInUp"></div>

      <div class="slide-newbie animated" data-ani-delay="1.5s" data-ani-duration="2s" data-ani-name="bounceInUp">
        GROOM
      </div>
      <div class="slide-newbie-name animated" data-ani-delay="1.5s" data-ani-duration="2s" data-ani-name="bounceInUp">
        新郎: 金圣聪
      </div>
      <div class="slide-newbie-describe animated" data-ani-delay="3s" data-ani-duration="3s"
           data-ani-name="slideInLeft">
        兜兜转转遇到你,自此世界美好无比
      </div>
    </div>

    <!-- 第四页 -->
    <div class="swiper-slide slide-4">
      <div class="slide-bg animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="fadeInUp"></div>
      <div class="slide-newbie-avatar animated" data-ani-delay="1.5s" data-ani-duration="2s"
           data-ani-name="bounceInUp"></div>

      <div class="slide-newbie animated" data-ani-delay="1.5s" data-ani-duration="2s" data-ani-name="bounceInUp">
        BRIDE
      </div>
      <div class="slide-newbie-name animated" data-ani-delay="1.5s" data-ani-duration="2s" data-ani-name="bounceInUp">
        新娘: 吴淑霞
      </div>
      <div class="slide-newbie-describe animated" data-ani-delay="3s" data-ani-duration="3s"
           data-ani-name="slideInRight">
        相知相爱,这是上天最好的安排
      </div>
    </div>

    <!-- 第五页 -->
    <div class="swiper-slide slide-5">
      <div class="slide-5-1-bg animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="zoomIn"></div>
      <div class="slide-5-1-yellow animated" data-ani-delay="3s" data-ani-duration="2s" data-ani-name="zoomIn"></div>
      <div class="slide-5-1-1-bg animated" data-ani-delay="0.5s" data-ani-duration="2s"
           data-ani-name="fadeInLeft"></div>
      <div class="horizontalAlignment">
        <div class="slide-5-3-bg animated" data-ani-delay="2s" data-ani-duration="2s" data-ani-name="fadeInLeft"></div>
        <div class="slide-5-2-bg animated" data-ani-delay="1s" data-ani-duration="2s" data-ani-name="zoomIn"></div>
      </div>
      <div class="slide-5-4-text animated" data-ani-delay="2s" data-ani-duration="2s" data-ani-name="fadeInUp">
        我眼中最美的风景
        <br>
        只有你
      </div>
      <div class="slide-5-4-bg animated" data-ani-delay="2s" data-ani-duration="2s" data-ani-name="fadeInRight"></div>
    </div>

    <!-- 第六页 -->
    <div class="swiper-slide slide-6">
      <div class="slide-6-0 animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="fadeInLeft"></div>
      <div class="horizontalAlignment">
        <div class="slide-6-1 animated" data-ani-delay="0.5s" data-ani-duration="2s" data-ani-name="fadeInLeft"></div>
        <div class="slide-6-2 animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="fadeInDownBig"></div>
      </div>
      <div class="horizontalAlignment">
        <div class="slide-6-3 animated" data-ani-delay="1s" data-ani-duration="2s" data-ani-name="zoomIn"></div>
        <div class="slide-6-4 animated" data-ani-delay="0s" data-ani-duration="2s" data-ani-name="bounceInRight"></div>
      </div>
      <div class="slide-6-5 animated" data-ani-delay="1s" data-ani-duration="2s" data-ani-name="zoomIn"></div>
      <div class="slide-6-6 animated" data-ani-delay="2s" data-ani-duration="2s" data-ani-name="fadeIn"></div>
    </div>
  </div>
</div>

<!-- 上滑动画 -->
<button class="up-arrow">
  <i class="icon-angle-double-up"></i>
</button>

<button class="btn-music">
  <i class="icon-note"></i>
</button>

<audio loop>
  <source src="audios/background.mp3" type="audio/mpeg">
</audio>

<!-- Don't delete this. It's needed for development workflow. -->
<!-- inject:js -->
<!-- endinject -->

</body>

</html>
